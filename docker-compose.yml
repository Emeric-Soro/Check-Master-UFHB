
version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: development
    container_name: check-master-web
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - check-master-network

  db:
    image: mysql:8.3
    container_name: check-master-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-soutenance_manager}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - check-master-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  db_data:
    driver: local

networks:
  check-master-network:
    driver: bridge