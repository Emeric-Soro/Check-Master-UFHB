<!DOCTYPE html>
<html>
<head>
    <title>Test AJAX Evaluation</title>
</head>
<body>
    <h2>Test AJAX - Récupération d'évaluation existante</h2>
    
    <p>
        <label>Numéro étudiant:</label>
        <input type="number" id="numEtu" value="1">
        <button onclick="testGetEvaluation()">Tester</button>
    </p>
    
    <div id="result"></div>
    
    <script>
    function testGetEvaluation() {
        const numEtu = document.getElementById('numEtu').value;
        const resultDiv = document.getElementById('result');
        
        resultDiv.innerHTML = '<p>Chargement...</p>';
        
        // Test avec différents chemins possibles
        const urls = [
            `ressources/routes/evaluationSoutenanceRoutes.php?action=getEvaluationExistante&num_etu=${numEtu}`,
            `?action=getEvaluationExistante&num_etu=${numEtu}`,
            `./ressources/routes/evaluationSoutenanceRoutes.php?action=getEvaluationExistante&num_etu=${numEtu}`
        ];
        
        function testUrl(index) {
            if (index >= urls.length) {
                resultDiv.innerHTML += '<p style="color: red;">❌ Tous les URLs ont échoué</p>';
                return;
            }
            
            const url = urls[index];
            console.log(`Test URL ${index + 1}: ${url}`);
            
            fetch(url)
                .then(response => {
                    console.log(`Response status: ${response.status}`);
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error(`HTTP ${response.status}`);
                })
                .then(data => {
                    console.log('Succès avec URL:', url);
                    console.log('Données reçues:', data);
                    resultDiv.innerHTML = `
                        <h3 style="color: green;">✅ Succès avec: ${url}</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                })
                .catch(error => {
                    console.log(`Échec avec URL ${url}:`, error);
                    resultDiv.innerHTML += `<p>❌ Échec: ${url} - ${error.message}</p>`;
                    testUrl(index + 1); // Essayer l'URL suivante
                });
        }
        
        testUrl(0); // Commencer le test
    }
    </script>
</body>
</html>
